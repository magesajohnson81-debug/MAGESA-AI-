<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGESA AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d1c;color:white;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;
}
.app{width:100%;max-width:650px;height:100vh;
 display:flex;flex-direction:column;background:#101a32}
header{padding:22px;background:#101a32;
 border-bottom:1px solid #26375e;text-align:center}
.logo{font-size:29px;font-weight:bold;color:#39c9ff}
header p{color:#aab9d5;margin:7px}
#messages{flex:1;overflow-y:auto;padding:18px}
.msg{padding:13px 16px;margin:12px 0;
 border-radius:15px;max-width:88%;line-height:1.5;
 white-space:pre-wrap}
.bot{background:#1c2b4b;border:1px solid #30476f}
.user{background:#075da0;margin-left:auto}
form{display:flex;gap:8px;padding:14px;
 background:#101a32;border-top:1px solid #26375e}
input{flex:1;min-width:0;padding:15px;
 border-radius:25px;border:1px solid #45618b;
 background:#172644;color:white;font-size:16px}
button{border:0;border-radius:25px;padding:0 20px;
 background:#087ff5;color:white;font-weight:bold}
footer{text-align:center;padding:9px;color:#8497b9;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">♛ MAGESA AI</div>
 <p>Your Smart AI Assistant</p>
</header>
<div id="messages">
 <div class="msg bot">Karibu kwenye MAGESA AI! 🤖
Nipo tayari kukusaidia. Niulize swali lolote.</div>
</div>
<form id="chat">
 <input id="question" placeholder="Andika swali lako..." autocomplete="off">
 <button type="submit">Tuma</button>
</form>
<footer>MAGESA AI • Knowledge, Power and Beyond</footer>
</div>
<script>
const form=document.getElementById("chat");
const input=document.getElementById("question");
const messages=document.getElementById("messages");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
}
form.addEventListener("submit",function(e){
 e.preventDefault();
 const q=input.value.trim();
 if(!q)return;
 addMessage(q,"user");
 input.value="";
 const answer="Asante kwa swali lako! MAGESA AI bado inaandaliwa. Hivi sasa hii ni toleo la mwanzo la majaribio.";
 setTimeout(()=>addMessage(answer,"bot"),500);
});
</script>
</body>
</html>
